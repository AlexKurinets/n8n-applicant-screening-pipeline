name: screening

x-app-env: &app-env
  SCREENING_DATABASE_URL: postgresql://pipeline:${POSTGRES_PASSWORD:-pipeline}@postgres:5432/screening
  PORTAL_DATABASE_URL: postgresql://pipeline:${POSTGRES_PASSWORD:-pipeline}@postgres:5432/portal
  PORTAL_INTERNAL_URL: http://portal:8080
  DOCSVC_INTERNAL_URL: http://docsvc:8070
  FAKE_LLM_INTERNAL_URL: http://fake-llm:8060
  N8N_INTERNAL_URL: http://n8n:5678
  MAILPIT_INTERNAL_URL: http://mailpit:8025
  LLM_BASE_URL: ${LLM_BASE_URL:-http://fake-llm:8060}
  LLM_MODEL: ${LLM_MODEL:-claude-opus-5-5}
  PORTAL_BOT_PASSWORD: ${PORTAL_BOT_PASSWORD:-local-demo-only}
  PORTAL_RECRUITER_PASSWORD: ${PORTAL_RECRUITER_PASSWORD:-local-demo-only}

x-app: &app
  build: .
  image: screening-app:local
  environment: *app-env

x-n8n-env: &n8n-env
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_DATABASE: n8n
  DB_POSTGRESDB_USER: pipeline
  DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-pipeline}
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-local-demo-encryption-key-not-for-production}
  GENERIC_TIMEZONE: UTC
  TZ: UTC
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"
  N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
  N8N_SECURE_COOKIE: "false"
  N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
  WEBHOOK_URL: http://localhost:${N8N_PORT:-5678}/
  N8N_INSTANCE_OWNER_MANAGED_BY_ENV: "true"
  N8N_INSTANCE_OWNER_EMAIL: owner@agency.example.com
  N8N_INSTANCE_OWNER_FIRST_NAME: Demo
  N8N_INSTANCE_OWNER_LAST_NAME: Owner
  # bcrypt of the local demo password "Screening-demo-1"
  N8N_INSTANCE_OWNER_PASSWORD_HASH: $$2a$$10$$qcMqFDV8LDdWWSnEULz4Dex/P8osgVzxq1x8HCGaM2Y0skvTMhXuq
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  LLM_BASE_URL: ${LLM_BASE_URL:-http://fake-llm:8060}
  PORTAL_BOT_PASSWORD: ${PORTAL_BOT_PASSWORD:-local-demo-only}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pipeline}

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pipeline}
      POSTGRES_DB: n8n
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5452}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U pipeline -d portal"]
      interval: 3s
      timeout: 3s
      retries: 30

  migrate:
    <<: *app
    command: ["node", "scripts/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    <<: *app
    command: ["node", "scripts/seed.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  greenmail:
    image: greenmail/standalone:2.1.13
    environment:
      GREENMAIL_ADDITIONAL_OPTS: -Dgreenmail.users=intake:intake-local@agency.example.com -Dgreenmail.users.login=email

  mailpit:
    image: axllent/mailpit:v1.31.2
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

  fake-llm:
    <<: *app
    command: ["node", "services/fake-llm/server.js"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8060/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20

  docsvc:
    <<: *app
    command: ["node", "services/docsvc/server.js"]
    environment:
      <<: *app-env
      DOCUMENT_DIR: /data/documents
    volumes:
      - documents:/data/documents
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8070/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20

  portal:
    <<: *app
    command: ["node", "services/portal/server.js"]
    environment:
      <<: *app-env
      SMTP_HOST: greenmail
      SMTP_PORT: "3025"
      INTAKE_MAILBOX: intake@agency.example.com
    ports:
      - "${PORTAL_PORT:-8085}:8080"
    depends_on:
      seed:
        condition: service_completed_successfully
      greenmail:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20

  n8n-import:
    image: n8nio/n8n:2.40.7
    entrypoint: ["/bin/sh", "/bootstrap/import.sh"]
    environment: *n8n-env
    volumes:
      - ./workflows:/workflows:ro
      - ./n8n:/bootstrap:ro
      - n8ndata:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  n8n:
    image: n8nio/n8n:2.40.7
    environment: *n8n-env
    volumes:
      - n8ndata:/home/node/.n8n
    ports:
      - "${N8N_PORT:-5678}:5678"
    depends_on:
      n8n-import:
        condition: service_completed_successfully
      portal:
        condition: service_healthy
      docsvc:
        condition: service_healthy
      fake-llm:
        condition: service_healthy
      greenmail:
        condition: service_started
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz/readiness || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40

  dashboard:
    <<: *app
    command: ["node", "services/dashboard/server.js"]
    environment:
      <<: *app-env
      N8N_PUBLIC_URL: http://localhost:${N8N_PORT:-5678}
      PORTAL_PUBLIC_URL: http://localhost:${PORTAL_PORT:-8085}
      MAILPIT_PUBLIC_URL: http://localhost:${MAILPIT_PORT:-8025}
    ports:
      - "${DASHBOARD_PORT:-8090}:8090"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20

  cli:
    <<: *app
    profiles: ["cli"]
    entrypoint: ["node", "scripts/cli.js"]

volumes:
  pgdata:
  documents:
  n8ndata:
